    <script>
        async function getData() {
            const url = "https://areebuzair.github.io/areebuzair/README.md";
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Response status: ${response.status}`);
                }

                const result = await response.text();
                document.querySelector("main").innerHTML = DOMPurify.sanitize(marked.parse(result))

            } catch (error) {
                console.error(error.message);
            }
        }
        getData()
    </script>
