    <script>

        const articleBody = document.getElementById("readme")
        async function getData() {
            const url = "https://areebuzair.github.io/areebuzair/README.md";
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Response status: ${response.status}`);
                }

                const result = await response.text();
                articleBody.innerHTML = DOMPurify.sanitize(marked.parse(result))

            } catch (error) {
                articleBody.innerHTML = error.message;
            }
        }
        getData()
